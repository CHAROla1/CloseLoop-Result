<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>闭环评测结果总览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e7edf5;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{max-width:65vw;padding:8px;background:#17202c;color:inherit}a{color:#4ecdc4}#status{padding:0 12px 10px;white-space:pre-wrap}iframe{width:100%;height:calc(100dvh - 115px);border:0}button{padding:8px}</style>
<header><strong>闭环评测结果</strong><select id="runs" aria-label="选择评测结果"></select><button id="refresh">刷新列表</button><a id="open" target="_blank" rel="noopener">单独打开</a></header>
<div id="status"></div><iframe id="report" title="闭环报告"></iframe>
<script>
let entries=[];const sel=document.getElementById('runs'),frame=document.getElementById('report'),status=document.getElementById('status'),link=document.getElementById('open');
function show(){const r=entries.find(x=>x.id===sel.value);if(!r)return;status.textContent=r.name+' · '+r.status+(r.error?' · '+r.error:'');if(r.url){frame.src=r.url;link.href=r.url;link.hidden=false}else{frame.removeAttribute('src');link.hidden=true}location.hash=encodeURIComponent(r.id)}
async function refresh(){const old=sel.value||decodeURIComponent(location.hash.slice(1));const res=await fetch('catalog.json',{cache:'no-store'});if(!res.ok)throw Error('无法读取结果列表');entries=(await res.json()).runs;sel.replaceChildren();for(const r of entries){const o=document.createElement('option');o.value=r.id;o.textContent=r.display_name||r.name;o.title=r.name+' ['+r.status+']';sel.append(o)}sel.value=entries.some(r=>r.id===old)?old:(entries.find(r=>r.url)?.id||entries[0]?.id||'');if(entries.length)show();else status.textContent='未发现 run 目录'}
sel.onchange=show;document.getElementById('refresh').onclick=()=>refresh().catch(e=>status.textContent=e.message);refresh().catch(e=>status.textContent=e.message);
</script></html>
